<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events — Win–Build–Send</title>
    <style>
        :root { color-scheme: dark; }
        body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #0891b222, transparent), #0b1120; color:#e2e8f0; }
        .wrap { max-width: 720px; margin: 6vh auto; padding: 0 20px; }
        h1 { font-size: 1.7rem; margin-bottom: 4px; }
        .sub { color:#94a3b8; margin-bottom: 26px; }
        .card { display:flex; gap:18px; align-items:center; background:#0f172aee; border:1px solid #1e293b;
            border-radius:14px; padding:18px 22px; margin-bottom:14px; }
        .date { text-align:center; min-width:64px; }
        .date .d { font-size:1.6rem; font-weight:800; color:#22d3ee; line-height:1; }
        .date .m { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:#64748b; }
        .info { flex:1; }
        .info .t { font-size:1.1rem; font-weight:600; }
        .info .meta { color:#94a3b8; font-size:.85rem; margin-top:3px; }
        .empty { padding:40px; text-align:center; color:#64748b; background:#0f172aee;
            border:1px solid #1e293b; border-radius:14px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Upcoming Events</h1>
    <div class="sub">Times shown in each event's local time zone.</div>

                        <div class="card">
                <div class="date">
                    <div class="d">15</div>
                    <div class="m">Dec</div>
                </div>
                <div class="info">
                    <div class="t">Launch Night: Win-Build-Send</div>
                    <div class="meta">
                        🔀 Hybrid                        &middot; 18:00 Africa/Accra                        &middot; Accra Innovation Hub                    </div>
                </div>
            </div>
                    <div class="card">
                <div class="date">
                    <div class="d">20</div>
                    <div class="m">Dec</div>
                </div>
                <div class="info">
                    <div class="t">Leadership Masterclass</div>
                    <div class="meta">
                        💻 Virtual                        &middot; 14:00 Africa/Accra                                            </div>
                </div>
            </div>
                    <div class="card">
                <div class="date">
                    <div class="d">10</div>
                    <div class="m">Jan</div>
                </div>
                <div class="info">
                    <div class="t">Community Outreach Day</div>
                    <div class="meta">
                        📍 Physical                        &middot; 09:00 Africa/Lagos                        &middot; Victoria Island Grounds                    </div>
                </div>
            </div>
            </div>
</body>
</html>
