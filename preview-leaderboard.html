<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaderboard — Win–Build–Send</title>
    <style>
        :root { color-scheme: dark; }
        body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #7c3aed22, transparent), #0b1120; color:#e2e8f0; }
        .wrap { max-width: 640px; margin: 6vh auto; padding: 0 20px; }
        h1 { font-size: 1.7rem; margin-bottom: 2px; }
        .sub { color:#94a3b8; margin-bottom: 26px; }
        .panel { background:#0f172aee; border:1px solid #1e293b; border-radius:16px; overflow:hidden; }
        .row { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid #1e293b; }
        .row:last-child { border-bottom:none; }
        .rank { width:36px; text-align:center; font-size:1.15rem; font-weight:700; }
        .who { flex:1; font-family: ui-monospace, monospace; font-size:.82rem; color:#cbd5e1; }
        .pts { font-weight:700; font-size:1.05rem; color:#a78bfa; }
        .pts small { color:#64748b; font-weight:400; font-size:.7rem; }
        .empty { padding:40px; text-align:center; color:#64748b; }
        .badge { display:inline-block; background:#312e81; color:#c7d2fe; padding:3px 10px; border-radius:999px; font-size:.72rem; margin-left:8px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Season Leaderboard
        <span class="badge">Season 2026</span>    </h1>
    <div class="sub">Non-redeemable recognition points for genuine, consented activity.</div>

    <div class="panel">
                                    <div class="row">
                    <div class="rank">🥇</div>
                    <div class="who">01a0643a…b0da</div>
                    <div class="pts">1,450 <small>pts</small></div>
                </div>
                            <div class="row">
                    <div class="rank">🥈</div>
                    <div class="who">01a0643a…26f9</div>
                    <div class="pts">1,180 <small>pts</small></div>
                </div>
                            <div class="row">
                    <div class="rank">🥉</div>
                    <div class="who">01a0643a…d84a</div>
                    <div class="pts">940 <small>pts</small></div>
                </div>
                            <div class="row">
                    <div class="rank">4</div>
                    <div class="who">01a0643a…9900</div>
                    <div class="pts">610 <small>pts</small></div>
                </div>
                            <div class="row">
                    <div class="rank">5</div>
                    <div class="who">01a0643a…ee66</div>
                    <div class="pts">275 <small>pts</small></div>
                </div>
                        </div>
</div>
</body>
</html>
