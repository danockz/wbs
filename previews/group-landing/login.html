<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Win–Build–Send</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            background: radial-gradient(1000px 500px at 50% -10%, #22d3ee22, transparent), #0b1120; color:#e2e8f0;
            display:grid; place-items:center; min-height:100vh; padding:20px; }
        .card { width:100%; max-width:400px; background:#0f172aee; border:1px solid #1e293b; border-radius:16px; padding:30px 28px; }
        h1 { font-size:1.5rem; margin:0 0 4px; }
        .sub { color:#94a3b8; font-size:.9rem; margin-bottom:20px; }
        label { display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:#94a3b8; margin:14px 0 6px; }
        input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #334155; background:#0b1120; color:#e2e8f0; font-size:1rem; }
        input:focus { outline:none; border-color:#22d3ee; }
        .btn { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px; background:#22d3ee; color:#00121a; font-weight:700; font-size:1rem; cursor:pointer; }
        .msg { margin-top:14px; font-size:.9rem; min-height:1.2em; }
        .msg.err { color:#fecaca; }
        .msg.ok { color:#86efac; }
        a { color:#22d3ee; text-decoration:none; }
        .alt { margin-top:18px; font-size:.85rem; color:#64748b; text-align:center; }
    </style>
</head>
<body>
    <form class="card" id="login-form">
        <h1>Sign in</h1>
        <div class="sub">Welcome back to Win–Build–Send.</div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@example.com">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">

        <button class="btn" type="submit">Sign in</button>
        <div class="msg" id="msg" role="status"></div>

        <div class="alt">Not a member yet? <a href="/g">Find a group to join →</a></div>
    </form>

    <script>
        (function () {
            var form = document.getElementById('login-form');
            var msg  = document.getElementById('msg');
            var ret  = "/g/kumasi-central";
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                msg.className = 'msg';
                msg.textContent = 'Signing in…';
                fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        email: form.email.value,
                        password: form.password.value
                    })
                }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
                  .then(function (res) {
                      if (res.ok) {
                          msg.className = 'msg ok';
                          msg.textContent = 'Signed in. Redirecting…';
                          window.location.assign(ret);
                      } else {
                          msg.className = 'msg err';
                          msg.textContent = (res.body && (res.body.detail || res.body.title)) || 'Sign-in failed. Check your details.';
                      }
                  }).catch(function () {
                      msg.className = 'msg err';
                      msg.textContent = 'Network error. Please try again.';
                  });
            });
        })();
    </script>
</body>
</html>
