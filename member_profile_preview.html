<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit profile — Win–Build–Send</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            background: radial-gradient(1000px 500px at 50% -10%, #22d3ee22, transparent), #0b1120; color:#e2e8f0;
            display:grid; place-items:start center; min-height:100vh; padding:32px 20px; }
        .wrap { width:100%; max-width:560px; }
        a.back { color:#22d3ee; text-decoration:none; font-size:.9rem; display:inline-block; margin-bottom:14px; }
        h1 { font-size:1.6rem; margin:0 0 4px; }
        .sub { color:#94a3b8; margin-bottom:22px; font-size:.95rem; }
        .flash { border-radius:10px; padding:12px 16px; margin:0 0 18px; font-size:.92rem; }
        .flash.ok { background:#052e26; border:1px solid #065f46; color:#a7f3d0; }
        .flash.err { background:#3f1d1d; border:1px solid #7f1d1d; color:#fecaca; }
        .card { background:#0f172aee; border:1px solid #1e293b; border-radius:14px; padding:20px 22px; margin-bottom:16px; }
        .card h2 { font-size:1.05rem; margin:0 0 4px; }
        .card .hint { color:#94a3b8; font-size:.85rem; margin:0 0 16px; }
        .head { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
        .avatar { width:56px; height:56px; border-radius:14px; border:1px solid #1e293b; object-fit:cover; background:#0b1120; }
        label { display:block; font-size:.78rem; color:#cbd5e1; margin:12px 0 4px; }
        input, select { width:100%; background:#0b1120; border:1px solid #334155; border-radius:9px; color:#e2e8f0; padding:10px 12px; font-size:.92rem; }
        input:focus, select:focus { outline:2px solid #22d3ee; border-color:#22d3ee; }
        input[readonly] { color:#94a3b8; cursor:not-allowed; }
        .readonly-note { color:#64748b; font-size:.78rem; margin-top:4px; }
        button { margin-top:16px; border:none; border-radius:9px; padding:11px 20px; font-size:.92rem; font-weight:600; cursor:pointer; background:#22d3ee; color:#04222a; }
        button.ghost { background:#1e293b; color:#e2e8f0; margin-inline-start:8px; }
        .btnrow { display:flex; flex-wrap:wrap; align-items:center; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="/me">← Back to home</a>
        <h1>Your profile</h1>
        <p class="sub">Update how your name appears and your language and time-zone preferences.</p>

                
        <!-- Details -->
        <form class="card" method="post" action="/me/profile">
            <input type="hidden" name="_csrf" value="PREVIEW-TOKEN">
            <div class="head">
                <img class="avatar" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5NiIgaGVpZ2h0PSI5NiIgdmlld0JveD0iMCAwIDk2IDk2IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkFNIj48cmVjdCB3aWR0aD0iOTYiIGhlaWdodD0iOTYiIHJ4PSIxNSIgcnk9IjE1IiBmaWxsPSIjZjk3MzE2Ii8+PHRleHQgeD0iNTAlIiB5PSI0OCIgZHk9IjAuMzVlbSIgZmlsbD0iI2ZmZmZmZiIgZm9udC1mYW1pbHk9InN5c3RlbS11aSwtYXBwbGUtc3lzdGVtLFNlZ29lIFVJLFJvYm90byxIZWx2ZXRpY2EsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSI0MCIgZm9udC13ZWlnaHQ9IjYwMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QU08L3RleHQ+PC9zdmc+" alt="" width="56" height="56">
                <h2>Your profile</h2>
            </div>

            <label for="p-name">Display name</label>
            <input id="p-name" name="display_name" value="Ama Mensah" maxlength="150" placeholder="The name others see">

            <label for="p-locale">Language</label>
            <select id="p-locale" name="locale">
                                    <option value="en" selected>English</option>
                                    <option value="fr">French</option>
                                    <option value="es">Spanish</option>
                                    <option value="pt">Portuguese</option>
                                    <option value="zh">Chinese</option>
                                    <option value="ar">Arabic</option>
                            </select>

            <label for="p-tz">Time zone</label>
            <input id="p-tz" name="timezone" value="Africa/Accra" maxlength="64" placeholder="e.g. Africa/Accra">

            <label for="p-email">Email</label>
            <input id="p-email" type="email" value="ama.mensah@example.org" readonly>
            <div class="readonly-note">Contact an administrator to change your email.</div>

            <button type="submit">Save changes</button>
        </form>

        <!-- Photo -->
        <form class="card" method="post" action="/me/photo">
            <input type="hidden" name="_csrf" value="PREVIEW-TOKEN">
            <h2>Profile photo</h2>
            <p class="hint">Paste an image URL, or remove your photo to use the initials avatar.</p>
            <label for="p-photo">Photo URL</label>
            <input id="p-photo" name="photo_url" value="" maxlength="512" placeholder="https://… or a data: image URI">
            <div class="btnrow">
                <button type="submit">Save photo</button>
            </div>
        </form>
            </div>
</body>
</html>
